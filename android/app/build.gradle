plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '57'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.2.57'

android {

    signingConfigs {
        release {
            storeFile file('/Users/babu/Documents/BABU/FLUTTER/Project/Document/Product/Play Consol/Final_Release/keystore')
            storePassword 'maakamoney'
            keyAlias 'maaka'
            keyPassword 'maakamoney'
        }
    }

    namespace "com.maaakanmoney.mm"

    compileSdkVersion 35
    ndkVersion flutter.ndkVersion

    // ---------------------------
    // FIXED JAVA SETTINGS → 17
    // ---------------------------
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    // ---------------------------
    // FIXED KOTLIN TARGET → 17
    // ---------------------------
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.maaakanmoney.mm"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        exclude 'META-INF/*'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/INDEX.LIST'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.1.0')

    implementation 'androidx.fragment:fragment:1.6.1'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-auth:21.0.1'
    implementation 'com.google.android.play:integrity:1.1.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
